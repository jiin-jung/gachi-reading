<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가치 읽기 — 학산도서관 공모전 제안 프로토타입</title>
<meta name="robots" content="noindex, noarchive, nosnippet">
<meta name="description" content="학산도서관 서비스 아이디어 공모전 제안 「가치 읽기」의 프로토타입입니다. 학산도서관 공식 서비스가 아닙니다.">
<meta property="og:title" content="가치 읽기 — 학산도서관 공모전 제안 프로토타입">
<meta property="og:description" content="메모 카드로 이어 읽는 교환독서. 공모전 제안용 프로토타입이며 학산도서관 공식 서비스가 아닙니다.">
<style>
  /* 인천대 홈페이지와 같은 에스코어드림 (무료 폰트, 눈누 CDN) */
  /* 에스코어드림은 획이 두꺼워서 한 단계씩 가볍게: 400→Light, 500→Regular, 600·700→Medium, 제목(800)만 Bold */
  @font-face { font-family:'S-CoreDream'; font-weight:400; font-display:swap; src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.2/S-CoreDream-3Light.woff') format('woff'); }
  @font-face { font-family:'S-CoreDream'; font-weight:500; font-display:swap; src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.2/S-CoreDream-4Regular.woff') format('woff'); }
  @font-face { font-family:'S-CoreDream'; font-weight:600 700; font-display:swap; src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.2/S-CoreDream-5Medium.woff') format('woff'); }
  @font-face { font-family:'S-CoreDream'; font-weight:800; font-display:swap; src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.2/S-CoreDream-6Bold.woff') format('woff'); }
  :root { --blue:#0A4A9B; --navy:#002F6A; --ink:#2F2F32; --sub:#5F6368; --line:#E6E9ED; --soft:#F7F8FA; --cover:#F1F4F8; --point:#FDB31E; }
  * { box-sizing: border-box; }
  body { margin:0; background:#fff; color:var(--ink); font-family:'S-CoreDream',system-ui,sans-serif; word-break:keep-all; overflow-wrap:anywhere; } /* 한국어는 단어 중간에서 줄바꿈 안 함 */
  header { position:sticky; top:0; z-index:20; background:#fff; border-bottom:1px solid var(--line); } /* 스크롤해도 '베타' 표시가 늘 보이게 */
  .wrap { max-width:1200px; margin:0 auto; padding:0 32px; }
  .top { display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; padding:18px 32px; }
  .brand { display:flex; align-items:center; gap:10px; font-size:18px; font-weight:700; color:var(--navy); letter-spacing:-0.02em; }
  .brand img { width:51px; height:30px; object-fit:contain; }
  @media (max-width:480px){ .brand{font-size:16px; gap:8px; white-space:nowrap} .beta-long{display:none} .top{flex-wrap:nowrap} } /* 폰: 한 줄에 '베타'만 */
  @media (max-width:340px){ .brand{font-size:15px} .brand img{width:44px} }
  .beta { padding:4px 10px; border:1px solid #F3C56B; border-radius:999px; background:#FFF7E6; color:#9A5B00; font-size:13px; font-weight:700; white-space:nowrap; }
  main { max-width:1200px; margin:0 auto; padding:56px 32px 64px; display:flex; flex-direction:column; align-items:center; text-align:center; }
  main > h1, footer { width:100%; max-width:1200px; margin-left:auto; margin-right:auto; }
  #list-now { width:100%; display:flex; flex-direction:column; align-items:center; }
  h1.title { margin:0; align-self:stretch; display:flex; flex-direction:column; align-items:flex-start; gap:8px; text-align:left; letter-spacing:-0.03em; }
  h1.title span { font-size:40px; font-weight:800; color:var(--navy); }
  h1.title small { font-size:17px; font-weight:500; color:var(--sub); }
  .sec { margin:0; font-size:22px; letter-spacing:-0.02em; color:var(--navy); }
  .sec span { font-size:16px; font-weight:500; color:var(--sub); }
  .shelf { width:100%; display:flex; margin-top:24px; }
  .row { flex:1 1 auto; min-width:0; display:flex; align-items:flex-end; gap:24px; padding:48px 0 0; outline:none; touch-action:pan-y; }
  .row:focus-visible { box-shadow:0 0 0 2px var(--blue); border-radius:8px; }
  .pick { position:relative; flex:1 1 0; min-width:0; padding:0; border:0; background:none; cursor:pointer; color:inherit; text-decoration:none; display:flex; flex-direction:column; align-items:center; gap:14px; font:inherit; }
  .pick[data-clone] { display:none; }
  .pick .cover { width:100%; border-radius:6px 22px 22px 6px; padding:24px 20px 24px 30px; box-shadow:inset 10px 0 0 rgba(0,47,106,.08), 3px 4px 0 var(--line); transform-origin:bottom center; transform:scale(1); transition:transform .35s ease, opacity .35s ease; }
  .pick .cover .t { font-size:20px; text-align:left; }
  .pick .cover .a { font-size:13px; text-align:left; }
  .pick.on .cover { transform:scale(1.12); }
  .row:has(.pick.on) .pick:not(.on) .cover { opacity:.55; } /* 하나 고르면 나머지만 흐리게 */
  .cover { position:relative; aspect-ratio:3/4; border-radius:4px 16px 16px 4px; overflow:hidden; border:1px solid var(--line); border-top:4px solid var(--point); background:var(--cover); color:var(--navy); box-shadow:inset 8px 0 0 rgba(0,47,106,.08), 2px 3px 0 var(--line); padding:18px 16px 18px 24px; display:flex; flex-direction:column; justify-content:space-between; }
  .cover img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .cover .t { font-size:17px; line-height:1.4; font-weight:700; letter-spacing:-0.02em; }
  .cover .a { font-size:12px; opacity:.85; }
  .field { font-size:12px; font-weight:700; color:var(--blue); }
  h3 { margin:0; font-size:16px; line-height:1.4; }
  .author { font-size:13px; color:var(--sub); }
  .meta { display:flex; flex-direction:column; gap:4px; }
  /* 버튼: 파란 버튼(.btn) / 테두리 버튼(.btn.ghost), 작은 크기(.sm) */
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:48px; padding:0 22px; border:1px solid var(--blue); border-radius:10px; background:var(--blue); color:#fff; font:inherit; font-size:15px; font-weight:700; text-decoration:none; white-space:nowrap; cursor:pointer; transition:background .15s, border-color .15s, transform .1s; }
  .btn:hover { background:var(--navy); border-color:var(--navy); }
  .btn:active { transform:translateY(1px); }
  .btn:focus-visible, .pick-link:focus-visible { outline:3px solid rgba(10,74,155,.35); outline-offset:2px; }
  .btn.ghost { background:#fff; color:var(--navy); border-color:#CDD4DC; }
  .btn.ghost:hover { background:var(--soft); border-color:var(--navy); }
  .btn.sm { min-height:40px; padding:0 14px; font-size:14px; font-weight:600; border-radius:8px; }
  .page { width:100%; max-width:640px; margin-top:32px; display:flex; flex-direction:column; gap:18px; text-align:left; animation:fadeUp .25s ease; }
  .page > .back { align-self:flex-start; }
  .page-head { display:flex; gap:24px; align-items:flex-end; }
  .page-head .cover { flex:0 0 140px; }
  .page-head h2 { margin:4px 0; font-size:26px; line-height:1.3; color:var(--navy); letter-spacing:-0.02em; }
  .page .prog { display:flex; flex-direction:column; gap:10px; font-size:15px; } .page .prog b { color:var(--navy); }
  .loan { font-size:13px; font-weight:600; color:var(--blue); } .loan.out { color:#9A5B00; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; } /* 메모 카드가 끼워진 페이지 */
  .chip { display:inline-flex; align-items:baseline; gap:6px; padding:8px 12px; border-radius:8px; background:#FFF7E6; border:1px solid #F3C56B; color:#7A4A00; font-size:15px; font-weight:700; }
  .chip small { font-size:12px; font-weight:500; }
  .cands .wish { border-color:var(--blue); background:#F5F8FD; }
  .action { display:flex; flex-direction:column; gap:10px; padding:20px; border:1px solid var(--line); border-radius:14px; }
  .action .btn { align-self:stretch; } .action .btn.ghost { align-self:flex-start; }
  .action p { margin:0; font-size:14px; line-height:1.6; color:var(--sub); }
  form { display:flex; flex-direction:column; gap:8px; }
  input { min-height:44px; padding:0 12px; border:1px solid #CDD4DC; border-radius:6px; font:inherit; font-size:14px; color:var(--ink); }
  input.text { flex:1 1 200px; min-width:0; }
  .review-fields { display:flex; flex-wrap:wrap; gap:8px; }
  .status { padding:24px; border-radius:10px; background:var(--soft); color:var(--sub); font-size:15px; line-height:1.6; }
  footer { margin-top:56px; border-top:1px solid var(--line); padding-top:20px; font-size:13px; line-height:1.6; color:var(--sub); display:flex; flex-direction:column; gap:4px; text-align:left; }
  footer summary { width:max-content; color:var(--blue); font-weight:600; cursor:pointer; }
  footer details div { margin-top:6px; display:flex; flex-direction:column; gap:4px; }
  @keyframes fadeUp { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
  @media (max-width:600px){ .top{padding:18px 20px} main{padding:40px 20px 48px} h1.title span{font-size:30px} .pick .cover .t{font-size:16px} .page-head h2{font-size:22px} .page-head .cover{flex-basis:110px} }
  .pick-link { display:block; width:100%; color:inherit; text-decoration:none; }
  .bubble { position:absolute; top:calc(100% + 18px); left:50%; transform:translateX(-50%); z-index:5; width:280px; padding:16px 18px; border-radius:14px; background:#fff; border:1px solid var(--line); box-shadow:0 8px 24px rgba(0,47,106,.12); display:none; flex-direction:column; gap:6px; text-align:left; }
  .bubble::before { content:''; position:absolute; top:-7px; left:50%; width:12px; height:12px; background:#fff; border-left:1px solid var(--line); border-top:1px solid var(--line); transform:translateX(-50%) rotate(45deg); }
  .bubble.first { left:0; transform:none; } .bubble.first::before { left:36%; }
  .bubble.last { left:auto; right:0; transform:none; } .bubble.last::before { left:64%; }
  .pick.on .bubble { display:flex; animation:bubbleIn .25s ease; }
  @keyframes bubbleIn { from { opacity:0; margin-top:-6px; } to { opacity:1; margin-top:0; } }
  .bubble .f { font-size:12px; font-weight:700; color:var(--blue); }
  .bubble .t2 { font-size:17px; line-height:1.35; font-weight:700; color:var(--navy); }
  .bubble .au { font-size:13px; color:var(--sub); }
  .bubble .p { font-size:13px; } .bubble .p b { color:var(--navy); }
  .bubble .s { font-size:13px; color:var(--sub); }
  .bubble .go { margin-top:6px; padding-top:10px; border-top:1px solid var(--line); font-size:13px; font-weight:700; color:var(--blue); }
  .bubble .btn { margin-top:6px; }
  .wish-list { width:100%; margin-top:64px; text-align:left; display:flex; flex-direction:column; gap:12px; }
  .wish-list .sec span { display:block; margin-top:4px; }
  .wish-list ul { list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(auto-fit, minmax(320px, 1fr)); gap:12px; }
  .wish { display:grid; grid-template-columns:64px minmax(0, 1fr); gap:12px 16px; align-items:end; padding:16px 18px; border:1px solid var(--line); border-radius:14px; }
  .wish .cover { align-self:start; padding:6px 6px 6px 10px; border-top-width:3px; } .wish .cover .t { font-size:11px; } .wish .cover .a { display:none; }
  .wish > div:not(.cover) { min-width:0; display:flex; flex-direction:column; gap:6px; align-self:stretch; }
  .wish > .btn { grid-column:2; justify-self:end; }
  .wish b { color:var(--navy); } .wish p { margin:0; font-size:14px; color:#35373A; }
  .wish .mp { margin-top:auto; font-size:13px; color:var(--sub); } .wish .mp b { color:var(--navy); }
  .wish-more { align-self:center; }
  .wish-msg { margin:0; font-size:14px; color:var(--blue); font-weight:600; } .wish-msg a { color:inherit; }
  .mini { width:100%; display:flex; flex-direction:column; gap:6px; text-align:left; margin-top:6px; }
  .mini .mt { font-size:14px; font-weight:700; color:var(--navy); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .mini .mp { font-size:12px; color:var(--sub); } .mini .mp b { color:var(--navy); }
  .bubble::after { content:''; position:absolute; left:0; right:0; top:-20px; height:20px; } /* 표지→말풍선 사이 틈에서 선택 풀리지 않게 */
  @media (max-width:600px){
    .row { gap:16px; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none; touch-action:pan-x pan-y; padding:24px calc((100% - 64vw)/2) 16px; }
    .row::-webkit-scrollbar { display:none; }
    .pick { flex:0 0 64vw; scroll-snap-align:center; scroll-snap-stop:always; }
    .pick.on .cover { transform:none; } /* 폰에선 확대 대신 양옆 책을 흐리게만 → ] [] [ 모양이 잘 보이게 */
    .pick[data-clone] { display:flex; }
    .mini .mt { overflow:visible; text-overflow:clip; }
    .mini .mp { white-space:nowrap; }
    .pick:not(.on) .mini { opacity:0; }
    .bubble { display:none !important; }
    .wish-list ul { grid-template-columns:minmax(0, 1fr); }
    .wish .btn { grid-column:1 / -1; width:100%; }
    .wish-form .review-fields { flex-direction:column; }
    .wish-form input, .wish-form .btn { width:100%; flex-basis:auto; }
    input { font-size:16px; }
  }
  @media (max-width:932px) and (max-height:500px){ input { font-size:16px; } }
</style>
</head>
<body>
<header><div class="wrap top">
  <div class="brand">
    <img src="/inu-logo.png" alt="">
    인천대학교 학산도서관
  </div>
  <span class="beta" title="공모전 제안 프로토타입입니다">베타<span class="beta-long"> · 공모전 프로토타입</span></span>
</div></header>

<main>
  <h1 class="title"><span>가치 읽기</span><small>메모 카드로 이어 읽는 교환독서</small></h1>
  <section id="list-now"><div class="status">국립중앙도서관 사서추천도서를 불러오는 중…</div></section>
  <footer>
    <span>메모 카드 수·대출 상태는 예시 데이터이며, 학산도서관 공식 서비스가 아닌 공모전 제안용 프로토타입입니다.</span>
    <details><summary>데이터 출처</summary><div>
      <span>도서 정보: 국립중앙도서관 사서추천도서 Open API · 표지: 국중도 서지정보 API, 없으면 카카오 책 검색 API, 구글 북스 API (모두 없으면 제목으로 표시)</span>
      <span>책 추천과 ‘나도 읽을래요’는 이 브라우저에만 저장됩니다.</span>
    </div></details>
  </footer>
</main>

<script>
const ui = { sel: -1, wishAll: false, wishMsg: '', wishHref: '', wishForm: null, wishCands: [] };
let data = null;

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

function coverHtml(b) {
  // 표지 이미지는 나중에 /api/cover로 채움. 없으면 제목 표지 그대로.
  return `<div class="cover" ${b.isbn ? `data-isbn="${esc(b.isbn)}"` : ''} aria-hidden="true">
    <span class="t">${esc(b.title)}</span><span class="a">${esc(b.author)}</span></div>`;
}
const loanText = (b) => (b.due ? `대출 중 · 반납 예정 ${esc(b.due)}` : '대출 가능');
// 메모 카드가 끼워진 페이지: [[페이지, 장 수], ...] 페이지 순 (같은 페이지에 여러 장 = 답글)
function pagesOf(b) {
  const m = new Map();
  for (const p of b.pages) m.set(p, (m.get(p) || 0) + 1);
  return [...m].sort((x, y) => x[0] - y[0]);
}
const BACK = '<a class="btn ghost sm back" href="#">← 목록으로</a>';
// 책 상세 (#book/<isbn>): 메모가 어느 페이지에 있는지만 보여 주고, 내용은 책을 빌려서 발견하게
function bookPage(b) {
  const pg = pagesOf(b);
  return `<section class="page">
    ${BACK}
    <div class="page-head">${coverHtml(b)}
      <div class="meta"><span class="field">${esc(b.field)}</span><h2>${esc(b.title)}</h2>
        <span class="author">${esc(b.author)}${b.publisher ? ' · ' + esc(b.publisher) : ''}</span>
        <span class="loan${b.due ? ' out' : ''}">${loanText(b)}</span></div></div>
    <div class="prog">
      <span><b>이 책에 끼워진 메모 카드 ${b.pages.length}장</b>${pg.length ? ` · ${pg.length}개 페이지` : ''}</span>
      ${pg.length ? `<div class="chips" aria-label="메모 카드가 끼워진 페이지">${pg.map(([p, n]) => `<span class="chip">p.${p}${n > 1 ? `<small>카드 ${n}장</small>` : ''}</span>`).join('')}</div>`
        : '<div class="status">아직 메모 카드가 없어요. 첫 카드를 끼워 주세요</div>'}
    </div>
    <div class="action">
      <p><b>어떤 메모인지는 책을 빌려서 그 페이지를 펼쳐 보세요.</b></p>
      <p>읽다 멈춘 페이지에 메모 카드를 끼우고 감상, 질문, 앞사람에게 답글을 자유롭게 남겨 주세요. 책에는 직접 쓰지 않고, 반납할 때 카드는 책에 그대로 두면 돼요.</p>
      <p>${b.due ? `지금은 대출 중이에요 (반납 예정 ${esc(b.due)}).` : '지금 대출 가능해요. 가치 읽기 서가에서 꺼내 평소처럼 빌리면 돼요.'}</p>
    </div>
  </section>`;
}
window.addEventListener('hashchange', () => { render(); setTimeout(() => window.scrollTo(0, 0)); });

function render() {
  if (!data) return;
  const [, id] = location.hash.match(/^#book\/([^/]+)/) || []; // 예전 QR 주소(#book/<isbn>/qr)도 상세로
  const book = id && data.now.find((b) => b.isbn === decodeURIComponent(id));
  if (book) {
    document.getElementById('list-now').innerHTML = bookPage(book);
    loadCovers();
    return;
  }
  document.getElementById('list-now').innerHTML = (data.now.length ? shelf(data.now) : '<div class="status">서가에 있는 책이 없어요.</div>')
    + wishSection(data.wish);
  loadCovers();
  requestAnimationFrame(initMobileShelf);
}

let shelfScrollTimer;
document.addEventListener('scroll', (e) => {
  if (!e.target.classList || !e.target.classList.contains('row')) return;
  syncMobileShelf(e.target);
  clearTimeout(shelfScrollTimer);
  shelfScrollTimer = setTimeout(() => settleMobileShelf(e.target), 160);
}, true);
window.addEventListener('resize', initMobileShelf);

function bubble(b, i, n) {
  const pos = i === 0 ? 'first' : i === n - 1 ? 'last' : '';
  const pg = pagesOf(b);
  return `<span class="bubble ${pos}">
    <span class="f">${esc(b.field)}</span>
    <span class="t2">${esc(b.title)}</span>
    <span class="au">${esc(b.author)}${b.publisher ? ' · ' + esc(b.publisher) : ''}</span>
    <span class="p"><b>메모 카드 ${b.pages.length}장</b>${pg.length ? ` · ${pg.map(([p]) => 'p.' + p).slice(0, 4).join(', ')}${pg.length > 4 ? ' …' : ''}` : ''}</span>
    <span class="s">${loanText(b)}</span>
    <span class="go">책을 눌러 메모 위치 보기</span>
  </span>`;
}
function shelf(books) {
  const card = (b, i, clone = '') => `<div class="pick${i === ui.sel ? ' on' : ''}" data-sel="${i}"${clone ? ` data-clone="${clone}" aria-hidden="true"` : ''}><a class="pick-link" href="#book/${encodeURIComponent(b.isbn)}"${clone ? ' tabindex="-1"' : ''} aria-label="${esc(b.title)}">${coverHtml(b)}</a>${mini(b)}${bubble(b, i, books.length)}</div>`;
  const loop = books.length > 1 ? card(books.at(-1), books.length - 1, 'before') : '';
  return `<div class="shelf">
    <div class="row" aria-label="가치 읽기 서가 (← → 키로 이동, Enter로 열기)">
      ${loop}${books.map((b, i) => card(b, i)).join('')}${books.length > 1 ? card(books[0], 0, 'after') : ''}
    </div></div>`;
}
// 표지 아래 항상 보이는 요약: 제목 + 메모 카드 수 + 대출 중 표시
function mini(b) {
  return `<span class="mini"><span class="mt">${esc(b.title)}</span>
    <span class="mp"><b>메모 카드 ${b.pages.length}장</b>${b.due ? ' · 대출 중' : ''}</span></span>`;
}
function select(i) {
  if (!data || i === ui.sel) return;
  if (i < 0 && innerWidth <= 600) return; // 폰은 가운데 책이 항상 선택 상태 (바깥을 탭해도 요약 유지)
  ui.sel = i;
  document.querySelectorAll('.pick').forEach((el) => el.classList.toggle('on', Number(el.dataset.sel) === i));
}
// 모바일 책장: 가운데에 가장 가까운 책 (복제본 포함)
function centerPick(row) {
  const mid = (el) => el.getBoundingClientRect().left + el.offsetWidth / 2;
  const center = row.getBoundingClientRect().left + row.clientWidth / 2;
  return [...row.querySelectorAll('.pick')].reduce((best, el) => (Math.abs(mid(el) - center) < Math.abs(mid(best) - center) ? el : best));
}
function syncMobileShelf(row) {
  if (innerWidth <= 600) select(Number(centerPick(row).dataset.sel));
}
// 끝과 처음 잇기: 복제본에서 멈추면 같은 책의 원본 위치로 몰래 이동
function settleMobileShelf(row) {
  if (innerWidth > 600) return;
  const pick = centerPick(row);
  if (!pick.dataset.clone) return;
  const original = row.querySelector(`.pick[data-sel="${pick.dataset.sel}"]:not([data-clone])`);
  row.scrollLeft += original.getBoundingClientRect().left - pick.getBoundingClientRect().left;
}
function initMobileShelf() {
  const row = document.querySelector('.row');
  if (innerWidth > 600) { if (row) row.scrollLeft = 0; return; }
  const picks = [...(row?.querySelectorAll('.pick:not([data-clone])') || [])];
  if (!picks.length) return;
  const i = Math.min(ui.sel < 0 ? 0 : ui.sel, picks.length - 1); const pick = picks[i];
  row.scrollLeft += pick.getBoundingClientRect().left + pick.offsetWidth / 2 - (row.getBoundingClientRect().left + row.clientWidth / 2);
  select(i);
}
function move(d) {
  const n = data.now.length; if (!n) return;
  select(ui.sel < 0 ? (d > 0 ? 0 : n - 1) : (ui.sel + d + n) % n);
  document.querySelectorAll('.pick:not([data-clone]) .pick-link')[ui.sel]?.focus();
}

// 표지 주소 요청은 ISBN당 한 번, 모든 책을 동시에 (하나가 느려도 나머지는 먼저 뜸)
const coverUrls = {};
function loadCovers() {
  for (const el of document.querySelectorAll('.cover[data-isbn]')) {
    const isbn = el.dataset.isbn;
    coverUrls[isbn] ??= fetch('/api/cover?isbn=' + isbn, { signal: AbortSignal.timeout(10000) })
      .then((r) => r.json()).then((j) => j.url || '').catch(() => '');
    coverUrls[isbn].then((url) => {
      if (!url || el.querySelector('img')) return;
      const img = new Image();
      img.alt = '';
      img.onerror = () => img.remove(); // 깨진 표지는 제목 표지로
      img.src = url;
      el.appendChild(img);
    });
  }
}

document.addEventListener('click', (e) => {
  const w = e.target.closest('[data-wish]'); if (w) { wish(w.dataset.wish); return; }
  const pk = e.target.closest('[data-pick]'); if (pk) { pickWish(Number(pk.dataset.pick)); return; }
  if (e.target.closest('[data-wish-all]')) { ui.wishAll = !ui.wishAll; render(); return; }
  if (!e.target.closest('.row')) select(-1);
});
// 마우스를 올리면 그 책이 커지고 설명이 바뀜
document.addEventListener('mouseover', (e) => { const p = e.target.closest && e.target.closest('[data-sel]'); if (p) select(Number(p.dataset.sel)); });
document.addEventListener('mouseout', (e) => { const row = e.target.closest && e.target.closest('.row'); if (row && !row.contains(e.relatedTarget)) select(-1); });
document.addEventListener('focusin', (e) => { const p = e.target.closest && e.target.closest('[data-sel]'); if (p) select(Number(p.dataset.sel)); });
// 행에 포커스가 있을 때만 ← → 로 이동
document.addEventListener('keydown', (e) => {
  if (!e.target.closest || !e.target.closest('.row')) return;
  if (e.key === 'ArrowLeft') { e.preventDefault(); move(-1); }
  if (e.key === 'ArrowRight') { e.preventDefault(); move(1); }
});
// 손가락으로 휙 넘기기: 40px 이상 밀면 한 칸 이동
let touchX = null;
document.addEventListener('touchstart', (e) => { if (innerWidth > 600 && e.target.closest('.row')) touchX = e.touches[0].clientX; }, { passive: true });
document.addEventListener('touchend', (e) => {
  if (innerWidth <= 600) { touchX = null; return; }
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX; touchX = null;
  if (Math.abs(dx) > 40) move(dx < 0 ? 1 : -1);
});
// 책 추천: 학생이 추천하고 다른 학생은 "나도 읽을래요". 사서가 확인해 가치 읽기 서가에 꽂음
// ponytail: 이 브라우저에만 저장, 실제 운영은 서버 저장소 필요
const WISH_KEY = 'gachi-wish';
const wishSaved = JSON.parse(localStorage.getItem(WISH_KEY) || '{"added":[],"joined":[]}');
const saveWish = () => localStorage.setItem(WISH_KEY, JSON.stringify(wishSaved));
// 많이 원하는 순(같으면 최근 추천 먼저), 기본 3권만 → 추천이 100권이어도 화면이 길어지지 않음
const WISH_SHOW = 3;
const wishCount = (w) => w.votes + (wishSaved.joined.includes(w.id) ? 1 : 0);
function wishSection(list) {
  const sorted = list.map((w, i) => ({ w, i, n: wishCount(w) })).sort((a, b) => b.n - a.n || b.i - a.i);
  const shown = ui.wishAll ? sorted : sorted.slice(0, WISH_SHOW);
  const items = shown.map(({ w, n }) => {
    const mine = wishSaved.joined.includes(w.id);
    return `<li class="wish">${coverHtml(w)}
      <div><b>${esc(w.title)}</b>${w.author ? ` <span class="author">${esc(w.author)}</span>` : ''}
        ${w.reason ? `<p>“${esc(w.reason)}”</p>` : ''}
        <span class="mp"><b>${n}명</b>이 읽고 싶어 해요</span></div>
      ${mine ? `<button type="button" class="btn ghost sm" data-wish="${esc(w.id)}">✓ 나도 읽을래요</button>`
        : `<button type="button" class="btn sm" data-wish="${esc(w.id)}">나도 읽을래요</button>`}
    </li>`;
  }).join('');
  const f = ui.wishForm || { title: '', reason: '' };
  const cands = ui.wishCands.map((b, i) => `<li class="wish">${coverHtml(b)}
      <div><b>${esc(b.title)}</b><span class="author">${esc(b.author)}${b.publisher ? ' · ' + esc(b.publisher) : ''}</span></div>
      <button type="button" class="btn sm" data-pick="${i}">이 책이에요</button></li>`).join('');
  return `<section class="wish-list">
    <h2 class="sec">다음에 서가에 꽂을 책 <span>읽고 싶은 책을 추천하면, 사서가 확인해 가치 읽기 서가에 꽂아요</span></h2>
    <form class="wish-form">
      <div class="review-fields">
        <input class="text" name="title" placeholder="읽고 싶은 책 제목" aria-label="책 제목" maxlength="60" required value="${esc(f.title)}">
        <input class="text" name="reason" placeholder="추천 한마디 (선택)" aria-label="추천 한마디" maxlength="80" value="${esc(f.reason)}">
        <button type="submit" class="btn">책 찾기</button>
      </div>
    </form>
    ${ui.wishMsg ? `<p class="wish-msg" role="status">${esc(ui.wishMsg)}${ui.wishHref ? ` <a href="${ui.wishHref}">보러 가기 →</a>` : ''}</p>` : ''}
    ${cands ? `<ul class="cands">${cands}</ul>` : ''}
    <ul>${items}</ul>
    ${list.length > WISH_SHOW ? `<button type="button" class="btn ghost sm wish-more" data-wish-all>${ui.wishAll ? '접기' : `추천 도서 ${list.length}권 모두 보기`}</button>` : ''}
  </section>`;
}
function wish(id) {
  const i = wishSaved.joined.indexOf(id);
  if (i >= 0) { if (!confirm('‘나도 읽을래요’를 취소할까요?')) return; wishSaved.joined.splice(i, 1); }
  else wishSaved.joined.push(id);
  saveWish(); render();
}
// 추천은 제목으로 실제 책을 검색해 고른 것만 → 아무 글자나 올라가지 않음
document.addEventListener('submit', async (e) => {
  const form = e.target.closest('.wish-form'); if (!form) return;
  e.preventDefault();
  const f = ui.wishForm = { title: form.title.value.trim(), reason: form.reason.value.trim() };
  if (!f.title) return;
  ui.wishCands = []; ui.wishHref = ''; ui.wishMsg = '책을 찾는 중…'; render();
  try {
    const res = await fetch('/api/search?q=' + encodeURIComponent(f.title), { signal: AbortSignal.timeout(8000) });
    const json = await res.json();
    if (!res.ok) throw new Error(json.error);
    ui.wishCands = json.books;
    ui.wishMsg = json.books.length ? '추천할 책을 골라주세요' : `「${f.title}」 책을 찾지 못했어요. 제목을 다시 확인해 주세요`;
  } catch {
    ui.wishMsg = '책 검색이 잠시 안 돼요. 잠시 후 다시 시도해 주세요';
  }
  render();
});
function pickWish(i) {
  const b = ui.wishCands[i], f = ui.wishForm;
  // 같은 책은 카드 하나로: ISBN이나 제목(공백·대소문자 무시)이 같으면 기존 카드에 함께
  const norm = (t) => t.replace(/\s+/g, '').toLowerCase();
  const is = (x) => (x.isbn && x.isbn === b.isbn) || norm(x.title) === norm(b.title);
  const now = data.now.find(is), same = data.wish.find(is);
  ui.wishHref = '';
  if (now) {
    ui.wishMsg = `이미 가치 읽기 서가에 있는 책이에요: 「${now.title}」`;
    ui.wishHref = '#book/' + encodeURIComponent(now.isbn);
  } else if (same) {
    const already = wishSaved.joined.includes(same.id);
    if (!already) { wishSaved.joined.push(same.id); saveWish(); }
    ui.wishMsg = already ? `이미 함께한 책이에요: 「${same.title}」` : `이미 추천된 책이라 ‘나도 읽을래요’에 함께했어요: 「${same.title}」`;
  } else {
    const w = { id: 'my-' + Date.now(), isbn: b.isbn, title: b.title, author: b.author, reason: f.reason, votes: 0 };
    wishSaved.added.push(w); wishSaved.joined.push(w.id); saveWish();
    data.wish.push(w); ui.wishMsg = `「${b.title}」 추천 완료! 사서가 확인한 뒤 서가에 꽂아요`;
  }
  ui.wishCands = []; ui.wishForm = null;
  render();
}

fetch('/api/books?v=memo', { // 데이터 모양이 바뀌면 v를 바꿔 CDN 캐시를 비움
   signal: AbortSignal.timeout(15000) }).then(async (res) => {
  const json = await res.json();
  if (!res.ok) throw new Error(json.error);
  data = json;
  data.wish = [...(data.wish || []), ...wishSaved.added];
  render();
}).catch((err) => {
  console.log('도서 불러오기 실패:', err);
  document.getElementById('list-now').innerHTML = `<div class="status">도서를 불러오지 못했어요. 잠시 후 다시 시도해 주세요.<br><button type="button" class="btn sm" onclick="location.reload()" style="margin-top:12px">다시 불러오기</button></div>`;
});
</script>
</body>
</html>
